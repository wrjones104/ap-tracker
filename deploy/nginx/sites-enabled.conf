# Copy of /etc/nginx/sites-enabled/* on the production VM, taken 2026-10-05.
# The VM is the source of truth; update this copy whenever the live files change.
# Both domains proxy to the API on 127.0.0.1:5000. ap-alerts.seedbot.net is the
# original domain, still served for older installs; archipelagoalerts.com is current.
# TLS certificates and the "managed by Certbot" lines are maintained by Certbot.

server {
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name ap-alerts.seedbot.net;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ap-alerts.seedbot.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ap-alerts.seedbot.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ap-alerts.seedbot.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 ;
    listen [::]:80 ;

    server_name ap-alerts.seedbot.net;
    return 404; # managed by Certbot
}
server {
    # CHANGE THIS to your new domain
    server_name archipelagoalerts.com;

    # Keep your existing logs or create new ones
    root /var/www/html;

    location / {
        # This remains exactly the same, pointing to your existing Flask app
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/archipelagoalerts.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/archipelagoalerts.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = archipelagoalerts.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name archipelagoalerts.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
