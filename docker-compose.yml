services:
  redis:
    image: redis:7-alpine
    container_name: ap_tracker_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ap_tracker_api
    restart: always
    command: python run_api_only.py
    env_file:
      - backend/.env
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Waitress worker threads. Tunable without a rebuild; keep <= SQLAlchemy pool_size (10).
      - WAITRESS_THREADS=${WAITRESS_THREADS:-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.40'
          memory: 256M
    depends_on:
      redis:
        condition: service_healthy

  poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ap_tracker_poller
    restart: always
    command: python run_poller_only.py
    env_file:
      - backend/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
        reservations:
          cpus: '0.50'
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:
