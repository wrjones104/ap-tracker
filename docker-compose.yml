services:
  postgres:
    image: postgres:15-alpine
    container_name: ap_tracker_db
    restart: always
    env_file:
      - backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ap_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ap_password}
      - POSTGRES_DB=${POSTGRES_DB:-ap_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ap_tracker_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ap_tracker_api
    restart: always
    command: python run_api_only.py
    env_file:
      - backend/.env
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ap_tracker_poller
    restart: always
    command: python run_poller_only.py
    env_file:
      - backend/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
